<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Vehicle Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:Arial, sans-serif}
  #info{text-align:center;font-size:18px;padding:10px;background:#222;color:#fff;
        display:flex;justify-content:space-around}
  #map{height:calc(100vh - 44px)}
  .arrow-icon{font-size:28px;display:inline-block;transform-origin:center center;
              transition:transform 0.4s linear;color:#e63946;text-shadow:0 0 3px rgba(0,0,0,0.4);}
  #status{font-size:13px;color:#aaa}
</style>
</head>
<body>

<div id="info">
  <span>Speed: <b id="speed">--</b> km/h</span>
  <span id="status">connecting...</span>
</div>
<div id="map"></div>

<script>
// ---- Firebase Realtime Database ----
const FIREBASE_URL = "https://vehicle-tracker-c7cc6-default-rtdb.asia-southeast1.firebasedatabase.app";
const FIREBASE_AUTH = ""; // leave "" if using test-mode rules, else your database secret

document.getElementById('status').textContent = 'loading map...';

if (typeof L === 'undefined') {
  document.getElementById('status').textContent = 'map library failed to load (check network/CDN block)';
} else {
  const map = L.map('map').setView([28.6139, 77.2090], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let marker = null;
  let polyline = L.polyline([], {color: '#2b7cff', weight: 4, smoothFactor: 1}).addTo(map);

  // --- Predictive (dead-reckoning) state: keeps the marker gliding smoothly between real fixes ---
  let lastFixPos = null;
  let lastFixTime = null;
  let lastFixSpeedKmh = 0;
  let lastFixCourse = 0;
  const MAX_PREDICT_SECONDS = 3;   // Arduino sends roughly every 3s, so don't extrapolate past that
  const MAX_REASONABLE_KMH = 150;  // ignore obviously noisy/garbage speed readings

  function makeIcon(course) {
    return L.divIcon({
      html: `<div class="arrow-icon" style="transform:rotate(${course}deg)">&#10148;</div>`,
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });
  }

  // Moves a lat/lng point forward by distanceKm along compass bearing bearingDeg (flat-earth approx, fine for short distances)
  function projectPosition(lat, lng, bearingDeg, distanceKm) {
    const bearingRad = bearingDeg * Math.PI / 180;
    const dNorthKm = distanceKm * Math.cos(bearingRad);
    const dEastKm = distanceKm * Math.sin(bearingRad);
    const newLat = lat + (dNorthKm / 111.32);
    const newLng = lng + (dEastKm / (111.32 * Math.cos(lat * Math.PI / 180)));
    return [newLat, newLng];
  }

  function predictLoop() {
    if (lastFixPos && lastFixTime && lastFixSpeedKmh > 0.5 && lastFixSpeedKmh <= MAX_REASONABLE_KMH) {
      const elapsedSeconds = Math.min((Date.now() - lastFixTime) / 1000, MAX_PREDICT_SECONDS);
      const elapsedHours = elapsedSeconds / 3600;
      const distanceKm = lastFixSpeedKmh * elapsedHours;
      const predicted = projectPosition(lastFixPos[0], lastFixPos[1], lastFixCourse, distanceKm);
      if (marker) marker.setLatLng(predicted);
    }
    requestAnimationFrame(predictLoop);
  }

  // Called for every real point coming from Firebase: snaps marker to the true position and,
  // for anything after the initial history load, extends the trail.
  function applyRealFix(newPos, course, speedKmh, addToTrail) {
    if (marker == null) {
      marker = L.marker(newPos, {icon: makeIcon(course)}).addTo(map);
      map.setView(newPos, 17);
    } else {
      marker.setLatLng(newPos);
      marker.setIcon(makeIcon(course));
    }
    if (addToTrail) polyline.addLatLng(newPos);
    lastFixPos = newPos;
    lastFixTime = Date.now();
    lastFixSpeedKmh = isNaN(speedKmh) ? 0 : speedKmh;
    lastFixCourse = course;
  }

  function handlePoint(val, isInitialBatch) {
    if (!val) return;
    const lat = parseFloat(val.lat);
    const lng = parseFloat(val.lng);
    const speed = parseFloat(val.speed);
    const course = parseFloat(val.course) || 0;
    if (isNaN(lat) || isNaN(lng)) return;

    applyRealFix([lat, lng], course, speed, !isInitialBatch);
    document.getElementById('speed').textContent = isNaN(speed) ? '--' : speed.toFixed(1);
    document.getElementById('status').textContent = 'live \u2022 ' + new Date().toLocaleTimeString();
  }

  // Streams the last 20 points on connect, then pushes every new point the instant it's written -
  // no polling delay like the old ThingSpeak version.
  const streamUrl = FIREBASE_URL + '/locations.json?orderBy="$key"&limitToLast=20' +
                     (FIREBASE_AUTH ? '&auth=' + FIREBASE_AUTH : '');
  const eventSource = new EventSource(streamUrl);

  eventSource.addEventListener('put', (event) => {
    try {
      const parsed = JSON.parse(event.data);
      const data = parsed.data;

      if (parsed.path === '/') {
        // Initial snapshot: the last 20 points, oldest to newest
        if (data) {
          const entries = Object.values(data).sort((a, b) => (a.ts || 0) - (b.ts || 0));
          entries.forEach((val) => handlePoint(val, true));
        } else {
          document.getElementById('status').textContent = 'no data yet';
        }
      } else {
        // A single new point was just written
        handlePoint(data, false);
      }
    } catch (e) {
      document.getElementById('status').textContent = 'data error: ' + e.message;
    }
  });

  eventSource.onerror = () => {
    document.getElementById('status').textContent = 'connection lost, retrying...';
  };

  predictLoop(); // start continuous dead-reckoning animation between real fixes
}
</script>
</body>
</html>
