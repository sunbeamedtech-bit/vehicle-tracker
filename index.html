<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Vehicle Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;font-family:Arial, sans-serif}
  #info{text-align:center;font-size:18px;padding:10px;background:#222;color:#fff;
        display:flex;justify-content:space-around}
  #map{height:calc(100vh - 44px)}
  .arrow-icon{font-size:28px;display:inline-block;transform-origin:center center;
              transition:transform 0.4s linear;}
  #status{font-size:13px;color:#aaa}
</style>
</head>
<body>

<div id="info">
  <span>Speed: <b id="speed">--</b> km/h</span>
  <span id="status">connecting...</span>
</div>
<div id="map"></div>

<script>
// ---- Fill these in from your ThingSpeak channel ----
const CHANNEL_ID = "3489696";
const READ_API_KEY = "QVUIJ617B0RMCIBW"; // leave as "" if the channel is public
const RESULTS_PER_FETCH = 8;    // how many recent points to pull each time (fills gaps)
const POLL_INTERVAL_MS = 3000;  // check for new data every 3s - picks up new entries as soon as they land

document.getElementById('status').textContent = 'loading map...';

if (typeof L === 'undefined') {
  document.getElementById('status').textContent = 'map library failed to load (check network/CDN block)';
} else {
  const map = L.map('map').setView([28.6139, 77.2090], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  let marker = null;
  let polyline = L.polyline([], {color: '#2b7cff', weight: 4, smoothFactor: 1}).addTo(map);
  let lastEntryId = null; // track which feeds we've already drawn, to avoid duplicate points
  let glideTimer = null;
  let isFirstFetch = true; // on page load, only place the marker - don't draw old history into the trail

  // --- Predictive (dead-reckoning) state: keeps the marker moving between real GPS fixes ---
  let lastFixPos = null;      // [lat, lng] at the moment of the last real fix
  let lastFixTime = null;     // Date.now() at the moment of the last real fix
  let lastFixSpeedKmh = 0;    // speed reported at the last real fix
  let lastFixCourse = 0;      // course/heading reported at the last real fix
  let predictTimer = null;

  // Moves a lat/lng point forward by `distanceKm` along compass bearing `bearingDeg` (flat-earth approx, fine for short vehicle-tracking distances)
  function projectPosition(lat, lng, bearingDeg, distanceKm) {
    const bearingRad = bearingDeg * Math.PI / 180;
    const dNorthKm = distanceKm * Math.cos(bearingRad);
    const dEastKm = distanceKm * Math.sin(bearingRad);
    const newLat = lat + (dNorthKm / 111.32);
    const newLng = lng + (dEastKm / (111.32 * Math.cos(lat * Math.PI / 180)));
    return [newLat, newLng];
  }

  // Runs continuously: estimates current position from the last real fix + elapsed time + speed/course
  function predictLoop() {
    if (lastFixPos && lastFixTime && lastFixSpeedKmh > 0.5) {
      const elapsedHours = (Date.now() - lastFixTime) / 3600000;
      const distanceKm = lastFixSpeedKmh * elapsedHours;
      const predicted = projectPosition(lastFixPos[0], lastFixPos[1], lastFixCourse, distanceKm);

      if (marker) {
        marker.setLatLng(predicted);
      } else {
        marker = L.marker(predicted, {icon: makeIcon(lastFixCourse)}).addTo(map);
      }
    }
    predictTimer = requestAnimationFrame(predictLoop);
  }

  function makeIcon(course) {
    return L.divIcon({
      html: `<div class="arrow-icon" style="transform:rotate(${course}deg)">&#10148;</div>`,
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });
  }

  // Called only when a REAL GPS fix arrives: snaps marker to the true position,
  // and resets the prediction baseline so dead-reckoning continues from here.
  function applyRealFix(newPos, course, speedKmh) {
    if (marker == null) {
      marker = L.marker(newPos, {icon: makeIcon(course)}).addTo(map);
      map.setView(newPos, 17);
    } else {
      marker.setLatLng(newPos);
      marker.setIcon(makeIcon(course));
    }
    lastFixPos = newPos;
    lastFixTime = Date.now();
    lastFixSpeedKmh = isNaN(speedKmh) ? 0 : speedKmh;
    lastFixCourse = course;
  }

  function updateGPS() {
    let url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=${RESULTS_PER_FETCH}`;
    if (READ_API_KEY) url += `&api_key=${READ_API_KEY}`;

    fetch(url)
      .then(r => r.json())
      .then(d => {
        const feeds = d.feeds || [];
        if (feeds.length === 0) { document.getElementById('status').textContent = 'no data yet'; return; }

        // Only process feeds newer than the last one we already drew, in chronological order
        let newFeeds = feeds;
        if (lastEntryId !== null) {
          newFeeds = feeds.filter(f => f.entry_id > lastEntryId);
        }
        if (newFeeds.length === 0) {
          document.getElementById('status').textContent = 'up to date, waiting for next reading';
          return;
        }

        let lastValidLatLng = null;
        let lastValidCourse = 0;
        let lastValidSpeed = null;
        let lastValidTime = null;

        newFeeds.forEach(feed => {
          const lat = parseFloat(feed.field1);
          const lng = parseFloat(feed.field2);
          const speed = parseFloat(feed.field3);
          const course = parseFloat(feed.field4) || 0;

          if (!isNaN(lat) && !isNaN(lng)) {
            if (!isFirstFetch) {
              polyline.addLatLng([lat, lng]);
            }
            lastValidLatLng = [lat, lng];
            lastValidCourse = course;
            lastValidSpeed = speed;
            lastValidTime = feed.created_at;
          }
          lastEntryId = feed.entry_id;
        });

        if (isFirstFetch && lastValidLatLng) {
          // start the trail fresh from this session's first known position
          polyline.addLatLng(lastValidLatLng);
        }
        isFirstFetch = false;

        if (lastValidLatLng) {
          applyRealFix(lastValidLatLng, lastValidCourse, lastValidSpeed);
          document.getElementById('speed').textContent = isNaN(lastValidSpeed) ? '--' : lastValidSpeed.toFixed(1);
          document.getElementById('status').textContent = 'last update: ' + new Date(lastValidTime).toLocaleTimeString();
        } else {
          document.getElementById('status').textContent = 'waiting for GPS fix';
        }
      })
      .catch((err) => {
        document.getElementById('status').textContent = 'connection error: ' + err.message;
      });
  }

  setInterval(updateGPS, POLL_INTERVAL_MS);
  updateGPS();
  predictLoop(); // start continuous dead-reckoning animation
}
</script>
</body>
</html>
